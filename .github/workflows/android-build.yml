name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['src/**', 'scripts/**', 'android/**', 'ci/**', 'package*.json', '.github/workflows/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dsh-mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: dsh-mobile
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            dsh-mobile/package-lock.json
            dsh-mobile/ci/sdk/*/package-lock.json
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - id: config
        run: node scripts/ci-version.mjs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ steps.config.outputs.upstream_ref }}
          path: dsh-mobile/artifacts/ci/official-source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: KKUCODES/dshm-relay
          ref: ${{ steps.config.outputs.backend_ref }}
          path: backend
          persist-credentials: false
      - name: Build shared protocol
        working-directory: backend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build --workspace @dsh-mobile/protocol
      - name: Prepare pinned client dependencies
        run: |
          npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
          npm run prepare:ci
          npm run build:web:ci
      - name: Build unsigned release candidate
        working-directory: dsh-mobile/android
        env:
          APP_VERSION: ${{ steps.config.outputs.version }}
          APP_VERSION_CODE: ${{ steps.config.outputs.version_code }}
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:lintRelease --no-daemon -PlatestCompatibilityTest=true -PofficialPluginOnlyTest=true -PofficialDshVersion=0.2.1-alpha.2 -PciBuild=true -PciVersionName="$APP_VERSION" -PciVersionCode="$APP_VERSION_CODE"
      - name: Prepare unsigned download
        run: node scripts/ci-package.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dshm-unsigned-apk
          retention-days: 30
          if-no-files-found: error
          path: dsh-mobile/artifacts/ci/packages/*
